name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 1.0.x
      - 1.1.x
    tags-ignore: [ v.* ]

permissions: {}

concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

env:
  PEKKO_TEST_TIMEFACTOR: 10.0
  EVENT_NAME: ${{ github.event_name }}
  # sbt otherwise runs with a 1g heap, which the unscoped `mimaReportBinaryIssues`
  # run in the Check Code Style job exhausts
  JAVA_OPTS: "-Xmx4g"

jobs:
  classify-pr:
    name: Classify root documentation changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout exact PR merge
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Prove that only existing root documentation files changed
        id: classify
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I - <<'PYTHON'
          import os
          import re
          import subprocess

          allowed = {b"README.md", b"CONTRIBUTING.md", b"AGENTS.md"}

          def git(*args):
              return subprocess.check_output(("git", *args))

          def docs_only(before, after):
              # Raw NUL-separated records preserve filenames verbatim. No rename
              # detection means a rename is seen as an add/delete and cannot qualify.
              records = git("diff", "--raw", "-z", "--no-renames", "--no-ext-diff",
                            "--no-textconv", "--ignore-submodules=none", before, after, "--")
              if not records:
                  return False
              fields = records.split(b"\0")
              return fields.pop() == b"" and len(fields) % 2 == 0 and all(
                  path in allowed and metadata.split()[:2] == [b":100644", b"100644"]
                  and metadata.split()[-1] == b"M"
                  for metadata, path in zip(fields[::2], fields[1::2])
              )

          base, head, merge = (os.environ[name] for name in ("PR_BASE_SHA", "PR_HEAD_SHA", "GITHUB_SHA"))
          if all(re.fullmatch(r"[0-9a-f]{40}", sha) for sha in (base, head, merge)):
              parents = git("rev-list", "--parents", "-n", "1", merge).decode("ascii").split()
              if parents == [merge, base, head]:
                  merge_bases = git("merge-base", "--all", base, head).decode("ascii").split()
                  # Prove both the PR's own changes and the actual merge result. Any
                  # ambiguity, failure or absent proof leaves docs_only unset.
                  if len(merge_bases) == 1 and docs_only(merge_bases[0], head) and docs_only(base, merge):
                      with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                          output.write("docs_only=true\n")
          PYTHON

  check-code-style:
    name: Check Code Style
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # we don't know what commit the last tag was it's safer to get entire repo so previousStableVersion resolves
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout GitHub merge
        if: github.event.pull_request
        run: |-
          git fetch origin pull/${{ github.event.pull_request.number }}/merge:scratch
          git checkout scratch


      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Code style check and binary-compatibility check
        # Run locally with: sbt 'checkCodeStyle; mimaReportBinaryIssues'
        run: sbt "checkCodeStyle; mimaReportBinaryIssues"

  check-code-compilation:
    name: Check Code Compilation
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout GitHub merge
        if: github.event.pull_request
        run: |-
          git fetch origin pull/${{ github.event.pull_request.number }}/merge:scratch
          git checkout scratch

      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Compile all code with fatal warnings for Java 17 and Scala 2.13/3
        # Run locally with: env CI=true sbt 'clean ; Test/compile'
        run: sbt "; +Test/compile"

  check-docs:
    name: Check Docs
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout GitHub merge
        if: github.event.pull_request
        run: |-
          git fetch origin pull/${{ github.event.pull_request.number }}/merge:scratch
          git checkout scratch

      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Create all API docs for artifacts/website and all reference docs
        run: sbt "doc ; unidoc ; docs/paradoxBrowse"

  test:
    name: Build and Test
    runs-on: ubuntu-22.04
    needs: [check-code-style, check-code-compilation, check-docs, classify-pr]
    if: >-
      ${{ always() && !cancelled() &&
          needs.check-code-style.result == 'success' &&
          needs.check-code-compilation.result == 'success' &&
          needs.check-docs.result == 'success' &&
          (github.event_name != 'pull_request' ||
           needs.classify-pr.result != 'success' ||
           needs.classify-pr.outputs.docs_only != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # confluent-version 7.x runs a Kafka 3 server, 8.x runs a Kafka 4 server
          - { java-version: 17,  scala-version: scala213, sbt-opts: '', confluent-version: '7.9.2' }
          - { java-version: 17,  scala-version: scala213, sbt-opts: '', confluent-version: '8.3.1' }
          - { java-version: 17,  scala-version: scala3, sbt-opts: '', confluent-version: '7.9.2' }
          - { java-version: 17,  scala-version: next, sbt-opts: '', confluent-version: '7.9.2' }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout GitHub merge
        if: github.event.pull_request
        run: |-
          git fetch origin pull/${{ github.event.pull_request.number }}/merge:scratch
          git checkout scratch

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Install sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Run tests with Scala ${{ matrix.scala-version }} and Java ${{ matrix.java-version }}
        env:
          CONFLUENT_PLATFORM_VERSION: ${{ matrix.confluent-version }}
        run: |-
          scala_version="$(bash .github/scripts/resolve-scala-version.sh "${{ matrix.scala-version }}")"
          sbt "++${scala_version}! test" ${{ matrix.sbt-opts }}

      - name: Print logs on failure
        if: ${{ failure() }}
        run: find . -name "*.log" -exec ./scripts/cat-log.sh {} \;

  integration-test:
    name: Integration tests (Confluent ${{ matrix.confluent-version }})
    needs: [check-code-style, check-code-compilation, check-docs, classify-pr]
    if: >-
      ${{ always() && !cancelled() &&
          needs.check-code-style.result == 'success' &&
          needs.check-code-compilation.result == 'success' &&
          needs.check-docs.result == 'success' &&
          (github.event_name != 'pull_request' ||
           needs.classify-pr.result != 'success' ||
           needs.classify-pr.outputs.docs_only != 'true') }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # confluent-version 7.x runs a Kafka 3 server, 8.x runs a Kafka 4 server
        confluent-version: ['7.9.2', '8.3.1']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout GitHub merge
        if: github.event.pull_request
        run: |-
          git fetch origin pull/${{ github.event.pull_request.number }}/merge:scratch
          git checkout scratch

      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Run multi-broker and long running integration tests
        env:
          CONFLUENT_PLATFORM_VERSION: ${{ matrix.confluent-version }}
        run: sbt "int-tests/test"

      - name: Print logs on failure
        if: ${{ failure() }}
        run: find . -name "*.log" -exec ./scripts/cat-log.sh {} \;
  build-benchmark:
    name: Build benchmarks
    needs: [check-code-style, check-code-compilation, check-docs, classify-pr]
    if: >-
      ${{ always() && !cancelled() &&
          needs.check-code-style.result == 'success' &&
          needs.check-code-compilation.result == 'success' &&
          needs.check-docs.result == 'success' &&
          (github.event_name != 'pull_request' ||
           needs.classify-pr.result != 'success' ||
           needs.classify-pr.outputs.docs_only != 'true') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout GitHub merge
        if: github.event.pull_request
        run: |-
          git fetch origin pull/${{ github.event.pull_request.number }}/merge:scratch
          git checkout scratch

      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install sbt
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: "Compile benchmark tests"
        run: sbt "benchmarks/Test/compile"
